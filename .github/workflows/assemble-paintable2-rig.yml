name: Assemble rigged Paintable2 GLB
on:
  push:
    branches: [main]
    paths:
      - 'objects/paintable2/assets/rig-upload/**'
      - '.github/workflows/assemble-paintable2-rig.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paintable2-rig-publish
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct, verify and validate skinned Paintable2
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,lzma,struct,json
          folder=Path('objects/paintable2/assets')
          source=folder/'rig-upload'
          parts=[source/f'Paintable2-rigged.xz.part{i:03d}' for i in range(6)]
          expected_sizes=[1048576,1048576,1048576,1048576,1048576,987988]
          if any(not p.is_file() or p.stat().st_size!=n for p,n in zip(parts,expected_sizes)):
              raise SystemExit('Missing or corrupted rig upload part')
          compressed=b''.join(p.read_bytes() for p in parts)
          if len(compressed)!=6230868 or hashlib.sha256(compressed).hexdigest()!='fa24f266b780a76e6d4db9c086a883b4e731c6035ff6ce6a17da4e6570aa1355':
              raise SystemExit('Compressed rig integrity failure')
          data=lzma.decompress(compressed,format=lzma.FORMAT_XZ)
          if len(data)!=19841024 or hashlib.sha256(data).hexdigest()!='6b4cc08e1aa5440a9bbbdb548be3eb876adf9e5bd73a8778a7598c45bb7c0921':
              raise SystemExit('Original rigged Paintable2 SHA-256 mismatch')
          if data[:4]!=b'glTF' or struct.unpack_from('<II',data,4)!=(2,len(data)):
              raise SystemExit('Invalid rigged GLB header')
          jlen,jtype=struct.unpack_from('<II',data,12)
          if jtype!=0x4E4F534A:raise SystemExit('Missing GLB JSON')
          doc=json.loads(data[20:20+jlen])
          if len(doc.get('skins',[]))!=1 or len(doc['skins'][0]['joints'])!=24:
              raise SystemExit('Missing 24-bone humanoid skin')
          if len(doc.get('materials',[]))!=9 or len(doc.get('images',[]))!=10:
              raise SystemExit('Original textures/materials were not preserved')
          if any('JOINTS_0' not in p['attributes'] or 'WEIGHTS_0' not in p['attributes'] for p in doc['meshes'][0]['primitives']):
              raise SystemExit('Some geometry is not skinned')
          if doc['nodes'][0].get('skin')!=0:
              raise SystemExit('Skinned mesh is not connected to skeleton')
          target=folder/'Paintable2-rigged.glb'
          if target.exists() and target.read_bytes()!=data:
              raise SystemExit('Refusing to overwrite a different rigged GLB')
          target.write_bytes(data)
          catalogue=Path('objects/manifest.json')
          d=json.loads(catalogue.read_text())
          entries=[o for o in d['objects'] if o['id']=='paintable2']
          if len(entries)!=1 or entries[0]['modelPath']!='./objects/paintable2/assets/Paintable2-rigged.glb':
              raise SystemExit('Paintable2 catalogue destination not found')
          entries[0]['status']='ready'
          catalogue.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          print('Paintable2 rig reconstructed and verified:',len(data),'bytes, 24 bones, 9 materials, 10 images')
          PY
      - name: Commit rigged GLB and remove temporary binary parts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add objects/paintable2/assets/Paintable2-rigged.glb objects/manifest.json
          git rm -r --ignore-unmatch -q objects/paintable2/assets/rig-upload
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified 24-bone skinned Paintable2 model'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
