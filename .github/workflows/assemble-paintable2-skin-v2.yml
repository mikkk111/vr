name: Repair Paintable2 skin weights (v2)
on:
  push:
    branches: [main]
    paths:
      - 'objects/paintable2/assets/skin-v2-upload/**'
      - '.github/workflows/assemble-paintable2-skin-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paintable2-skin-v2
  cancel-in-progress: false
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and validate the corrected Paintable2 GLB
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,lzma,struct,json
          asset=Path('objects/paintable2/assets')
          staging=asset/'skin-v2-upload'
          parts=[staging/f'Paintable2-rigged-v2.xz.part{i:03d}' for i in range(6)]
          expected=[1048576]*5+[983568]
          if any(not p.is_file() or p.stat().st_size!=n for p,n in zip(parts,expected)):
              raise SystemExit('Incorrect or missing Paintable2 skin-v2 transfer parts')
          packed=b''.join(p.read_bytes() for p in parts)
          if len(packed)!=6226448 or hashlib.sha256(packed).hexdigest()!='74ea8a90bfe02d0df767f805861c54e011d0c6af8a5ffb37a3e087476ddae0d8':
              raise SystemExit('Compressed binary checksum mismatch')
          data=lzma.decompress(packed,format=lzma.FORMAT_XZ)
          if len(data)!=19841044 or hashlib.sha256(data).hexdigest()!='51430f7115516d9b19e0bb78a3f140f0c5d0d458d178e18bf201f48ba0d65593':
              raise SystemExit('Reconstructed GLB differs from validated original')
          if data[:4]!=b'glTF' or struct.unpack_from('<II',data,4)!=(2,len(data)):
              raise SystemExit('GLB header invalid')
          n,t=struct.unpack_from('<II',data,12)
          if t!=0x4E4F534A:raise SystemExit('GLB JSON chunk missing')
          doc=json.loads(data[20:20+n])
          if len(doc.get('skins',[]))!=1 or len(doc['skins'][0]['joints'])!=24:
              raise SystemExit('Corrected 24-bone skin not found')
          if len(doc.get('materials',[]))!=9 or len(doc.get('images',[]))!=10:
              raise SystemExit('Original materials/textures lost')
          if not all('JOINTS_0' in p['attributes'] and 'WEIGHTS_0' in p['attributes'] for p in doc['meshes'][0]['primitives']):
              raise SystemExit('Missing skinned mesh attributes')
          target=asset/'Paintable2-rigged-v2.glb'
          if target.exists() and target.read_bytes()!=data:
              raise SystemExit('Refusing to overwrite different rigged model')
          target.write_bytes(data)
          cfg=Path('objects/paintable2/config.js')
          text=cfg.read_text()
          old="modelUrl: './assets/Paintable2-rigged.glb'"
          assert text.count(old)==1,'Unexpected rig config; cannot switch safely'
          cfg.write_text(text.replace(old,"modelUrl: './assets/Paintable2-rigged-v2.glb'"))
          script=Path('objects/paintable2/app.js')
          source=script.read_text()
          assert "from './config.js?v=paintable2-rig-1'" in source
          script.write_text(source.replace("from './config.js?v=paintable2-rig-1'","from './config.js?v=paintable2-rig-2'"))
          index=Path('objects/paintable2/index.html')
          page=index.read_text()
          assert 'src="./app.js?v=paintable2-rig-1"' in page
          index.write_text(page.replace('src="./app.js?v=paintable2-rig-1"','src="./app.js?v=paintable2-rig-2"'))
          manifest=Path('objects/manifest.json')
          catalogue=json.loads(manifest.read_text())
          entries=[x for x in catalogue['objects'] if x.get('id')=='paintable2']
          assert len(entries)==1
          entry=entries[0]
          assert entry.get('modelPath')=='./objects/paintable2/assets/Paintable2-rigged.glb'
          entry['modelPath']='./objects/paintable2/assets/Paintable2-rigged-v2.glb'
          entry['description']='Corrected 24-bone skinned Paintable2 with limb-isolated weights and independent Quest trigger posing; Zelda v13 grips unchanged.'
          entry['status']='ready'
          manifest.write_text(json.dumps(catalogue,ensure_ascii=False,indent=2)+'\n')
          readme=Path('objects/paintable2/README.md')
          readme.write_text(readme.read_text()+'\n## Rig weight correction — v2, 20 November 2026\n\n'
              'The initial procedural weights erroneously assigned torso/pelvis influence to wrist/hand vertices, creating stretched membranes and needle-like strands when posing arms.\n'
              'Rebuilt from the original Paintable2.glb with skeleton-proximity arm masks and distal arm isolation. The 24-bone hierarchy, original geometry, UVs, 9 materials and 10 textures remain preserved. '
              'The previous Paintable2-rigged.glb is retained for comparison; the active model is Paintable2-rigged-v2.glb.\n\n'
              'GLB SHA-256: 51430f7115516d9b19e0bb78a3f140f0c5d0d458d178e18bf201f48ba0d65593\n\n'
              'Offline deformation regression: under a combined ~69° shoulder and ~57° elbow bend on each arm, the old mesh had >5× edge stretching on ~1.15% of edges; the v2 sample had none. '
              'Procedural posing still requires visual and physical Quest testing.\n')
          print('Verified 19,841,044-byte rigged GLB, skin hierarchy, textured materials, fixed model and cache-busting page.')
          PY
      - name: Atomic switch to corrected model and remove transfer parts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add objects/paintable2/assets/Paintable2-rigged-v2.glb objects/paintable2/config.js objects/paintable2/app.js objects/paintable2/index.html objects/paintable2/README.md objects/manifest.json
          git rm -r --ignore-unmatch -q objects/paintable2/assets/skin-v2-upload
          if ! git diff --cached --quiet; then
            git commit -m 'Fix Paintable2 limb mesh stretching with isolated skin weights'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
