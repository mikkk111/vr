<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VR Projects — Hello World</title>
<style>body{font:16px/1.6 system-ui,sans-serif;margin:0;background:#f8f8f6;color:#202020}main{max-width:760px;margin:8vh auto;padding:0 24px}h1{font-size:clamp(44px,8vw,80px);letter-spacing:-.06em;margin:0}p{color:#666}article{border-top:1px solid #ddd;padding:18px 0}a{color:inherit;font-size:1.2rem;font-weight:650;text-decoration:none}a:hover{text-decoration:underline}small{color:#777}h2{font-size:1.2rem}</style>
</head>
<body><main><h1>Hello World.</h1><p>Virtual reality projects — Meta Quest 3</p><h2>Experience library</h2><section id="catalogue" aria-live="polite">Loading catalogue…</section><noscript>Enable JavaScript to see the project catalogue.</noscript></main>
<script>
(async()=>{const root=document.getElementById('catalogue');try{const r=await fetch('./objects/manifest.json',{cache:'no-store'});if(!r.ok)throw Error(r.status);const {objects}=await r.json();root.replaceChildren();for(const o of objects){const el=document.createElement('article');const t=document.createElement('a');t.textContent=o.title;t.href=o.url;el.append(t);const p=document.createElement('p');p.textContent=o.description;el.append(p);const s=document.createElement('small');s.textContent=o.status==='pending'?'Model upload pending — local GLB picker available':o.status==='ready'?'Model hosted — Quest testing pending':'Source recovered — Quest testing pending';el.append(s);root.append(el)}}catch(e){root.textContent='Catalogue could not be loaded.';console.error(e)}})();
</script></body></html>
