<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Splat Painter V1.0 — Quest 3</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      width: 100%;
      background-color: black;
    }
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      outline: none; /* Remove default focus outline */
      touch-action: none;
    }
    #mode-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      font-family: sans-serif;
      font-size: 16px;
      font-weight: bold;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    #xr-panel {position:fixed;left:12px;bottom:12px;z-index:1500;background:#181818ed;color:white;padding:12px;border-radius:8px;font:14px/1.4 system-ui;max-width:min(340px,85vw)} #xr-panel button {padding:10px;margin:4px 3px;cursor:pointer} #xr-panel a{color:#ddd} #xr-panel p{margin:5px 0} #xr-panel button:disabled{opacity:.45}
    #mode-overlay.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0"></canvas>
  <div id="mode-overlay"></div>
  <section id="xr-panel"><strong>Splat Painter V1.0 — Spark 2.4</strong><p id="xr-status" role="status">Loading original bedroom…</p><button id="vr" disabled>Enter VR — full room</button><button id="ar" disabled>Enter passthrough — miniature</button><p>Right trigger paints; left trigger restores. Right A cycles colour, B toggles eraser. In passthrough, side grips move and resize the room. In VR, look and move your head naturally.</p><a href="../../">Main menu</a> · <a href="https://sparkjs.dev/examples/#splat-painter">Original demo</a></section>
  <script>window.addEventListener("error",e=>document.getElementById("xr-status").textContent="Error: "+e.message);window.addEventListener("unhandledrejection",e=>document.getElementById("xr-status").textContent="Error: "+(e.reason?.message||e.reason));</script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.4.0/spark.module.js",
        "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.20.0/dist/lil-gui.esm.js"
      }
    }
  </script>
  <script type="module">
    import {
      dyno,
      SparkRenderer,
      SplatMesh,
      RgbaArray,
      readRgbaArray,
      SparkControls,
      writeSpz,
      unpackSplat,
      PackedSplats,
    } from "@sparkjsdev/spark";
    import * as THREE from "three";
    const originalAsset = "https://storage.googleapis.com/forge-dev-public/marble-scenes/greyscale-room.spz";
    const $ = id => document.getElementById(id);
    const status = message => { $("xr-status").textContent = message; console.log("[Splat Painter]",message); };
    import { GUI } from "lil-gui";


    const PARAMETERS = {
      controlsEnabled: true,
      eraseEnabled: dyno.dynoBool(false),
      brushEnabled: dyno.dynoBool(false),
      undoEnabled: dyno.dynoBool(false),
      brushDepth: dyno.dynoFloat(10.0),
      brushRadius: dyno.dynoFloat(0.05),
      brushOrigin: dyno.dynoVec3(new THREE.Vector3(0.0, 0.0, 0.0)),
      brushDirection: dyno.dynoVec3(new THREE.Vector3(0.0, 0.0, 0.0)),
      brushColorHex: "#ff00ff",
      brushColor: dyno.dynoVec3(new THREE.Vector3(1.0, 0.0, 1.0)),
    };

    const MIN_BRUSH_RADIUS = 0.01;
    const MAX_BRUSH_RADIUS = 0.25;
    const MIN_BRUSH_DEPTH = 0.1;
    const MAX_BRUSH_DEPTH = 100.0;

    const assetID = "greyscale-bedroom.spz";
    let currentSplatMesh = null;
    let currentFileName = "painted-splat";
    let currentSplatMeshOriginalRGBA = null;

    function brushDyno(
        brushEnabled,
        eraseEnabled,
        undoEnabled,
        brushRadius,
        brushDepth,
        brushOrigin,
        brushDirection,
        brushColor,
        originalRgba,
    ) {
        const flatColor = dyno.dynoVec3(new THREE.Vector3(1.0, 1.0, 1.0));
        const luminanceThreshold = dyno.dynoFloat(0.1);
        return dyno.dynoBlock({ gsplat: dyno.Gsplat }, { gsplat: dyno.Gsplat }, ({ gsplat }) => {
            if (!gsplat) {
                throw new Error("No gsplat input");
            }
            let { center, rgb, opacity, index } = dyno.splitGsplat(gsplat).outputs;
            const projectionAmplitude = dyno.dot(brushDirection, dyno.sub(center, brushOrigin));
            const projectedCenter = dyno.add(brushOrigin, dyno.mul(brushDirection, projectionAmplitude));
            const distance = dyno.length(dyno.sub(projectedCenter, center)); // distance from projected center to actual center
            const isInside = dyno.and(dyno.lessThan(distance, brushRadius), 
                                      dyno.and(dyno.greaterThan(projectionAmplitude, dyno.dynoFloat(0.0)),
                                      dyno.lessThan(projectionAmplitude, brushDepth)));
            // Paint/erase mode: change RGB or alpha values for splats inside brush
            const luminanceOld = dyno.div(dyno.dot(rgb, flatColor), dyno.dynoFloat(3.0));
            const luminanceNew = dyno.max(dyno.div(dyno.dot(brushColor, flatColor), dyno.dynoFloat(3.0)), dyno.dynoFloat(0.001));
            const weightedRgb = dyno.mul(brushColor, dyno.div(luminanceOld, luminanceNew));
            const isLuminanceAboveThreshold = dyno.greaterThan(luminanceOld, luminanceThreshold);
            let newRgb = dyno.select(dyno.and(dyno.and(brushEnabled, isInside), isLuminanceAboveThreshold), weightedRgb, rgb);
            let newOpacity = dyno.select(eraseEnabled, dyno.select(isInside, dyno.dynoFloat(0.0), opacity), opacity);
            
            // Undo mode: restore original RGBA for splats inside brush
            const originalRgbaValue = readRgbaArray(originalRgba, index);
            const originalRgbVec = dyno.vec3(originalRgbaValue);
            const originalOpacityVal = dyno.swizzle(originalRgbaValue, "w");
            newRgb = dyno.select(dyno.and(undoEnabled, isInside), originalRgbVec, newRgb);
            newOpacity = dyno.select(dyno.and(undoEnabled, isInside), originalOpacityVal, newOpacity);
            
            gsplat = dyno.combineGsplat({ gsplat, rgb: newRgb, opacity: newOpacity });
            return { gsplat };
        });
    }

    function paintableSplatMesh(
      url,
      brushEnabled,
      eraseEnabled,
      undoEnabled,
      brushRadius,
      brushDepth,
      brushOrigin,
      brushDirection,
      brushColor,
      originalRgba,
    ) {
      const splatMesh = new SplatMesh({
        url: url,
        onFrame: ({ mesh, time }) => {
          mesh.needsUpdate = true;
        },
        onLoad: () => {
          splatMesh.worldModifier = brushDyno(
            brushEnabled,
            eraseEnabled,
            undoEnabled,
            brushRadius, 
            brushDepth,
            brushOrigin, 
            brushDirection, 
            brushColor,
            originalRgba,
          );
          splatMesh.splatRgba = new RgbaArray().fromPackedSplats({
            packedSplats: splatMesh.packedSplats,
            base: 0,
            count: splatMesh.packedSplats.numSplats,
            renderer,
          });
          splatMesh.updateGenerator();
        },
      });
      return splatMesh;
    }

    const canvas = document.getElementById("canvas");
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: false });
    renderer.xr.enabled = true;
    renderer.xr.setReferenceSpaceType("local");
    renderer.xr.setFramebufferScaleFactor(0.65);
    renderer.domElement.addEventListener("webglcontextlost",e=>{e.preventDefault();status("Graphics context lost — close the tab and reload.");$("vr").disabled=$("ar").disabled=true;renderer.setAnimationLoop(null);renderer.xr.getSession()?.end().catch(()=>{});});
    renderer.setClearColor(new THREE.Color(0xaaffff), 1);

    const scene = new THREE.Scene();
    const spark = new SparkRenderer({ renderer, maxStdDev: Math.sqrt(5), sortRadial: true });
    scene.add(spark);
    const controls = new SparkControls({
      canvas: renderer.domElement,
    });

    const camera = new THREE.PerspectiveCamera(
      50,
      window.innerWidth / window.innerHeight,
      0.01,
      1000,
    );
    camera.position.set(0, 0, 0);
    camera.lookAt(0, 0, -1);
    const rig = new THREE.Group(), anchor = new THREE.Group(), content = new THREE.Group();
    scene.add(rig, anchor); rig.add(camera); anchor.add(content);
    let physics = null, activeMode = null, entering = false, roomBounds = null;
    let lastError = "", lastStamp = 0;

    function handleResize() {
      if (renderer.xr.isPresenting) return;
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }

    handleResize();
    window.addEventListener("resize", handleResize);

    async function loadSplatFromFile(url) {
      if (currentSplatMesh) {
        content.remove(currentSplatMesh);
        currentSplatMesh.splatRgba?.dispose();
        currentSplatMesh.dispose();
        currentSplatMeshOriginalRGBA?.dispose();
      }
      // Extract filename for export
      currentFileName = url.split("/").pop().split("?")[0].split(".")[0] || "painted-splat";
      // Create an empty RgbaArray that will be populated after the mesh loads
      currentSplatMeshOriginalRGBA = new RgbaArray();
      currentSplatMesh = await paintableSplatMesh(
        url,
        PARAMETERS.brushEnabled,
        PARAMETERS.eraseEnabled,
        PARAMETERS.undoEnabled,
        PARAMETERS.brushRadius, 
        PARAMETERS.brushDepth,
        PARAMETERS.brushOrigin, 
        PARAMETERS.brushDirection, 
        PARAMETERS.brushColor,
        currentSplatMeshOriginalRGBA.dyno
      );
      currentSplatMesh.quaternion.set(1, 0, 0, 0);
      content.add(currentSplatMesh);

      // Wait for the mesh to fully load before accessing packed data
      await currentSplatMesh.initialized;

      // Extract original RGBA directly from the packed splats
      currentSplatMeshOriginalRGBA = new RgbaArray();
      currentSplatMeshOriginalRGBA.fromPackedSplats({
        packedSplats: currentSplatMesh.packedSplats,
        base: 0,
        count: currentSplatMesh.packedSplats.numSplats,
        renderer: renderer
      });
      
      // Update the world modifier with the populated original RGBA
      currentSplatMesh.worldModifier = brushDyno(
        PARAMETERS.brushEnabled,
        PARAMETERS.eraseEnabled,
        PARAMETERS.undoEnabled,
        PARAMETERS.brushRadius, 
        PARAMETERS.brushDepth,
        PARAMETERS.brushOrigin, 
        PARAMETERS.brushDirection, 
        PARAMETERS.brushColor,
        currentSplatMeshOriginalRGBA.dyno
      );
      currentSplatMesh.updateGenerator();
    }

    await loadSplatFromFile(originalAsset);
    status("Original bedroom loaded. Checking headset support…");

    const raycaster = new THREE.Raycaster();
    let isDragging = false;
    
    // Mode overlay functionality
    const modeOverlay = document.getElementById('mode-overlay');
    let overlayTimeout;
    
    function showModeOverlay(text) {
      modeOverlay.textContent = text;
      modeOverlay.classList.add('show');
      
      // Clear any existing timeout
      if (overlayTimeout) {
        clearTimeout(overlayTimeout);
      }
      
      // Hide overlay after 2 seconds
      overlayTimeout = setTimeout(() => {
        modeOverlay.classList.remove('show');
      }, 2000);
    }

    function updateRgba() {
      if (currentSplatMesh && currentSplatMesh.splatRgba) {
        const xrEnabled = renderer.xr.enabled;
        renderer.xr.enabled = false;
        try {
        const newRgba = new RgbaArray();
        newRgba.render({
          renderer,
          count: currentSplatMesh.packedSplats.numSplats,
          reader: dyno.dynoBlock({ index: "int" }, { rgba8: "vec4" }, ({ index }) => {
            const { gsplat } = currentSplatMesh.generator.apply({ index });
            const { rgba } = dyno.splitGsplat(gsplat).outputs;
            return { rgba8: rgba };
          }),
        });

        currentSplatMesh.splatRgba.dispose();
        currentSplatMesh.splatRgba = newRgba;
        currentSplatMesh.updateGenerator();
        } finally { renderer.xr.enabled = xrEnabled; }
      }
    }

    renderer.domElement.addEventListener('pointermove', (event) => {
        const clickCoords = new THREE.Vector2(
          (event.clientX / renderer.domElement.width) * 2 - 1,
          -(event.clientY / renderer.domElement.height) * 2 + 1,
        );
        raycaster.setFromCamera(clickCoords, camera);
        const direction = raycaster.ray.direction.normalize();
        PARAMETERS.brushDirection.value.x = direction.x;
        PARAMETERS.brushDirection.value.y = direction.y;
        PARAMETERS.brushDirection.value.z = direction.z;
        PARAMETERS.brushOrigin.value.x = raycaster.ray.origin.x;
        PARAMETERS.brushOrigin.value.y = raycaster.ray.origin.y;
        PARAMETERS.brushOrigin.value.z = raycaster.ray.origin.z;

        // Apply painting effect while dragging
        if (isDragging) {
          updateRgba();
        }
      });
    
    renderer.domElement.addEventListener('pointerdown', (event) => {
      isDragging = true;
      updateRgba();
    });
    
    renderer.domElement.addEventListener('pointerup', (event) => {
      isDragging = false;
    });
    
    renderer.domElement.addEventListener('pointerleave', (event) => {
      isDragging = false;
    });

    const gui = new GUI();
    
    // Instructions section
    const instructions = {
      brush: "Brush Mode",
      erase: "Erase Mode",
      undo: "Undo Mode",
      none: "View Mode",
      increase: "Increase Brush Size",
      decrease: "Decrease Brush Size",
      increaseDepth: "Increase Brush Depth",
      decreaseDepth: "Decrease Brush Depth"
    };
    const instructionsFolder = gui.addFolder("Instructions");
    instructionsFolder.add(instructions, "brush").name("1:").disable();
    instructionsFolder.add(instructions, "erase").name("2:").disable();
    instructionsFolder.add(instructions, "undo").name("3:").disable();
    instructionsFolder.add(instructions, "none").name("Esc:").disable();
    instructionsFolder.add(instructions, "increase").name("=:").disable();
    instructionsFolder.add(instructions, "decrease").name("-:").disable();
    instructionsFolder.add(instructions, "increaseDepth").name("]:").disable();
    instructionsFolder.add(instructions, "decreaseDepth").name("[:").disable();
    instructionsFolder.open();
    const brushRadiusController = gui.add(PARAMETERS.brushRadius, "value", MIN_BRUSH_RADIUS, MAX_BRUSH_RADIUS, 0.01).name("Brush Radius");
    const brushDepthController = gui.add(PARAMETERS.brushDepth, "value", MIN_BRUSH_DEPTH, MAX_BRUSH_DEPTH, 0.1).name("Brush Depth");
    gui.addColor(PARAMETERS, "brushColorHex").name("Brush Color").onChange((value) => {
      PARAMETERS.brushColor.value = new THREE.Color(value).convertLinearToSRGB();
      console.log(PARAMETERS.brushColor.value);
    });

    // I/O functionality (load and export)
    const ioOptions = {
      filename: currentFileName,
      maxSh: 0,  // Painted splats don't preserve SH data
      fractionalBits: 12,
      loadFile: () => {
        // Create file input element
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.spz,.ply';
        input.onchange = async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          
          // Create a blob URL from the file
          const url = URL.createObjectURL(file);
          
          try {
            await loadSplatFromFile(url);
            console.log("Loaded file:", file.name);
            // Update filename for export
            ioOptions.filename = file.name.split(".")[0] || "painted-splat";
          } catch (error) {
            console.error("Error loading file:", error);
            alert("Failed to load file. Make sure it's a valid SPZ or PLY file.");
          } finally {
            // Clean up the object URL
            URL.revokeObjectURL(url);
          }
        };
        input.click();
      },
      saveToSpz: async () => {
        if (!currentSplatMesh) {
          console.error("Export failed - currentSplatMesh:", !!currentSplatMesh);
          alert("No splat mesh loaded for export.");
          return;
        }

        try {
          console.log("Starting SPZ export with painted changes...");
          
          if (!currentSplatMesh.splatRgba) throw new Error("Splat colour buffer not initialized");

          const rgba = new RgbaArray();
          rgba.render({
            renderer,
            count: currentSplatMesh.packedSplats.numSplats,
            reader: dyno.dynoBlock({ index: "int" }, { rgba8: "vec4" }, ({ index }) => {
              const { gsplat } = currentSplatMesh.generator.apply({ index });
              const { rgba } = dyno.splitGsplat(gsplat).outputs;
              return { rgba8: rgba };
            }),
          })
          const rgbaBytes = await rgba.read();
          
          const ogSplats = currentSplatMesh.packedSplats;
          const totalSplats = ogSplats.numSplats;
          console.log("Total splats:", totalSplats);
          
          let nonZeroCount = 0;
          for (let i = 0; i < totalSplats; i++) {
            const opacity = rgbaBytes[i * 4 + 3] / 255;
            if (opacity > 0) {
              nonZeroCount++;
            }
          }
          
          // Create new PackedSplats with baked changes
          const newPackedSplats = new PackedSplats({
            maxSplats: nonZeroCount,
            splatEncoding: ogSplats.splatEncoding,
          });
          
          // Build splat array from baked RGBA
          let processedCount = 0;
          for (let i = 0; i < totalSplats; i++) {
            const rgbaOffset = i * 4;
            const opacity = rgbaBytes[rgbaOffset + 3] / 255;
            
            // Skip erased splats (zero opacity)
            if (opacity === 0) {
              continue;
            }
            
            // Unpack geometry from original packed array
            const unpacked = unpackSplat(
              ogSplats.packedArray,
              i,
              ogSplats.splatEncoding
            );
            
            // Replace color/opacity with baked painted values
            unpacked.color.r = rgbaBytes[rgbaOffset + 0] / 255;
            unpacked.color.g = rgbaBytes[rgbaOffset + 1] / 255;
            unpacked.color.b = rgbaBytes[rgbaOffset + 2] / 255;
            unpacked.opacity = opacity;

            // Push to new PackedSplats
            newPackedSplats.pushSplat(
              unpacked.center,
              unpacked.scales,
              unpacked.quaternion,
              unpacked.opacity,
              unpacked.color
            );
            
            processedCount++;
          }

          console.log(`Processed ${processedCount} splats`);
          
          // Now export the PackedSplats to SPZ
          console.log("Writing splats to SPZ...");
          const { fileBytes: spzBytes } = await writeSpz(newPackedSplats, ioOptions.maxSh, ioOptions.fractionalBits);

          console.log("Creating download...");
          const blob = new Blob([spzBytes], { type: "application/octet-stream" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = ioOptions.filename + "-painted.spz";
          a.click();
          URL.revokeObjectURL(url);
          
          console.log("SPZ file with painted changes downloaded successfully:", ioOptions.filename + "-painted.spz");
        } catch (error) {
          console.error("Error exporting SPZ:", error);
          console.error("Error stack:", error.stack);
        }
      },
    };

    const ioFolder = gui.addFolder("I/O");
    ioFolder.add(ioOptions, "loadFile").name("Load Splats (SPZ/PLY)");
    ioFolder.add(ioOptions, "saveToSpz").name("Save Splats (SPZ)");
    ioFolder.open();

        // Keyboard controls
    window.addEventListener('keydown', (event) => {
      if (event.key === '1') {
        // Brush mode
        PARAMETERS.brushEnabled.value = true;
        PARAMETERS.eraseEnabled.value = false;
        PARAMETERS.undoEnabled.value = false;
        PARAMETERS.controlsEnabled = false;
        controls.enabled = false;
        showModeOverlay('Paint Mode');
      } else if (event.key === '2') {
        // Eraser mode
        PARAMETERS.brushEnabled.value = false;
        PARAMETERS.eraseEnabled.value = true;
        PARAMETERS.undoEnabled.value = false;
        PARAMETERS.controlsEnabled = false;
        controls.enabled = false;
        showModeOverlay('Erase Mode');
      } else if (event.key === '3') {
        // Undo mode
        PARAMETERS.brushEnabled.value = false;
        PARAMETERS.eraseEnabled.value = false;
        PARAMETERS.undoEnabled.value = true;
        PARAMETERS.controlsEnabled = false;
        controls.enabled = false;
        showModeOverlay('Undo Mode');
      } else if (event.key === 'Escape') {
        // View mode
        PARAMETERS.brushEnabled.value = false;
        PARAMETERS.eraseEnabled.value = false;
        PARAMETERS.undoEnabled.value = false;
        PARAMETERS.controlsEnabled = true;
        controls.enabled = true;
        showModeOverlay('View Mode');
      } else if (event.key === '=' || event.key === '+') {
        // Increase brush radius
        const currentRadius = PARAMETERS.brushRadius.value;
        const newRadius = Math.min(currentRadius + 0.01, MAX_BRUSH_RADIUS);
        PARAMETERS.brushRadius.value = newRadius;
        brushRadiusController.updateDisplay();
      } else if (event.key === '-' || event.key === '_') {
        // Decrease brush radius
        const currentRadius = PARAMETERS.brushRadius.value;
        const newRadius = Math.max(currentRadius - 0.01, MIN_BRUSH_RADIUS);
        PARAMETERS.brushRadius.value = newRadius;
        brushRadiusController.updateDisplay();
      } else if (event.key === ']') {
        // Increase brush depth
        const currentDepth = PARAMETERS.brushDepth.value;
        const newDepth = Math.min(currentDepth + 0.5, MAX_BRUSH_DEPTH);
        PARAMETERS.brushDepth.value = newDepth;
        brushDepthController.updateDisplay();
      } else if (event.key === '[') {
        // Decrease brush depth
        const currentDepth = PARAMETERS.brushDepth.value;
        const newDepth = Math.max(currentDepth - 0.5, MIN_BRUSH_DEPTH);
        PARAMETERS.brushDepth.value = newDepth;
        brushDepthController.updateDisplay();
      }
    });

    console.log("Starting render loop");

    // Animation loop
    const supported = async mode => !!navigator.xr && await navigator.xr.isSessionSupported(mode).catch(()=>false);
    async function buttons() {
      $("vr").disabled=!(await supported("immersive-vr"));
      $("ar").disabled=!(await supported("immersive-ar"));
    }
    function resetBrush() {
      PARAMETERS.brushEnabled.value=false; PARAMETERS.eraseEnabled.value=false; PARAMETERS.undoEnabled.value=false;
    }
    function resetRoom() {
      anchor.position.set(0,0,0); anchor.quaternion.identity(); anchor.scale.setScalar(1);
      content.position.set(0,0,0); content.scale.setScalar(1);
      rig.position.set(0,0,0); rig.quaternion.identity();
    }
    function miniRoom() {
      currentSplatMesh.updateMatrix();
      roomBounds=currentSplatMesh.getBoundingBox(true).clone().applyMatrix4(currentSplatMesh.matrix);
      const size=roomBounds.getSize(new THREE.Vector3());
      const center=roomBounds.getCenter(new THREE.Vector3());
      const scale=1.5/Math.max(size.x,size.y,size.z);
      if (!Number.isFinite(scale)||scale<=0) throw Error("Invalid room bounds");
      content.scale.setScalar(scale); content.position.copy(center).multiplyScalar(-scale);
      anchor.position.set(0,-0.15,-2.2);
      physics.attachModel(size.multiplyScalar(scale));
    }
    // The native local reference space preserves the original demo's camera origin.
    // Keep the original full-room pose in VR; use an independent miniature in AR.
    let initPhysicsError=null;
    try {
      const {createGrabPhysics}=await import("../../shared/zelda-v13/physics-grab.js?v=template-1");
      physics=await createGrabPhysics({renderer,rig,modelAnchor:anchor,onStatus:status});
    } catch(e){ initPhysicsError=e; console.warn("AR manipulation unavailable",e); }
    async function enter(mode) {
      if(entering||renderer.xr.isPresenting)return;
      entering=true; $("vr").disabled=$("ar").disabled=true; lastError="";
      let session;
      try {
        if(mode==="immersive-ar"&&!physics)throw Error("Shared grab engine unavailable: "+initPhysicsError);
        // Request inside the click event, before asynchronous setup.
        session=await navigator.xr.requestSession(mode,{requiredFeatures:["local"]});
        if(mode==="immersive-ar"&&session.environmentBlendMode!=="alpha-blend")throw Error("Passthrough alpha blend unavailable");
        resetRoom(); resetBrush(); controls.enabled=false; PARAMETERS.controlsEnabled=false;
        camera.position.set(0,0,0);camera.quaternion.identity();
        if(mode==="immersive-ar")miniRoom();
        renderer.setClearColor(mode==="immersive-ar"?0x000000:0xaaffff,mode==="immersive-ar"?0:1);
        activeMode=mode;
        await renderer.xr.setSession(session);
        status("XR ready · right trigger paint, left trigger restore");
      }catch(e){lastError="XR failed: "+e.message;status(lastError);if(session)await session.end().catch(()=>{});activeMode=null;resetRoom();controls.enabled=true;PARAMETERS.controlsEnabled=true;renderer.setClearColor(0xaaffff,1);}
      finally{entering=false;if(!renderer.xr.isPresenting)await buttons();}
    }
    $("vr").onclick=()=>enter("immersive-vr");
    $("ar").onclick=()=>enter("immersive-ar");
    renderer.xr.addEventListener("sessionend",()=>{
      activeMode=null;physics?.releaseAll();resetRoom();resetBrush();controls.enabled=true;PARAMETERS.controlsEnabled=true;
      camera.position.set(0,0,0);camera.quaternion.identity();renderer.setClearColor(0xaaffff,1);
      buttons();status(lastError||"Desktop preview — original bedroom");
    });
    const rayOrigin=new THREE.Vector3(),rayDirection=new THREE.Vector3(),rayQ=new THREE.Quaternion();
    const viewer=new THREE.Vector3(),viewRight=new THREE.Vector3(),viewQ=new THREE.Quaternion();
    const colors=["#ff00ff","#ff3333","#28adff","#ffdd00","#00ff66"];
    let colorIndex=0,erase=false,prevA=false,prevB=false,prevT=0,snapReady=true;
    function axes(g){const a=g?.axes||[],x=a.length>=4?a[2]:a[0],y=a.length>=4?a[3]:a[1];return [Math.abs(x||0)>.16?x:0,Math.abs(y||0)>.16?y:0];}
    function xrInput(t,frame,dt){
      const space=renderer.xr.getReferenceSpace(),pose=frame?.getViewerPose(space);
      if(!space||!pose)return;
      const p=pose.transform.position,q=pose.transform.orientation;
      viewer.set(p.x,p.y,p.z);rig.localToWorld(viewer);
      viewQ.set(q.x,q.y,q.z,q.w).premultiply(rig.quaternion);
      viewRight.set(1,0,0).applyQuaternion(viewQ);viewRight.y=0;viewRight.normalize();
      let left,right;
      for(const s of renderer.xr.getSession().inputSources){if(!s.gamepad)continue;if(s.handedness==="left")left=s;else if(s.handedness==="right")right=s;}
      const la=axes(left?.gamepad),ra=axes(right?.gamepad);
      if(activeMode==="immersive-ar"&&physics){
        physics.pollGrips();if(la[0])physics.adjustModelSide(la[0],dt,viewRight);
        const y=Math.abs(la[1])>=Math.abs(ra[1])?la[1]:ra[1];if(y)physics.adjustModelDepth(y,dt,viewer);
        if(Math.abs(ra[0])<.3)snapReady=true;
        if(snapReady&&Math.abs(ra[0])>.7){snapReady=false;if(!physics.isHolding("right")){const pivot=viewer.clone();const rot=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),-Math.sign(ra[0])*Math.PI/6);rig.position.sub(pivot).applyQuaternion(rot).add(pivot);rig.quaternion.premultiply(rot);}}
        physics.update(dt);
      }
      const a=!!right?.gamepad.buttons[4]?.pressed,b=!!right?.gamepad.buttons[5]?.pressed;
      if(a&&!prevA){colorIndex=(colorIndex+1)%colors.length;PARAMETERS.brushColorHex=colors[colorIndex];const c=new THREE.Color(colors[colorIndex]).convertLinearToSRGB();PARAMETERS.brushColor.value.set(c.r,c.g,c.b);}
      if(b&&!prevB)erase=!erase;
      prevA=a;prevB=b;
      const restoring=(left?.gamepad.buttons[0]?.value||0)>.6;
      const painting=(right?.gamepad.buttons[0]?.value||0)>.6;
      const source=restoring?left:painting?right:null;
      resetBrush();
      if(!source||t-lastStamp<110)return; // limit full RGBA bake rate on headset
      const ray=frame.getPose(source.targetRaySpace,space);if(!ray)return;
      const rp=ray.transform.position,rq=ray.transform.orientation;
      rayOrigin.set(rp.x,rp.y,rp.z);rig.localToWorld(rayOrigin);
      rayQ.set(rq.x,rq.y,rq.z,rq.w).premultiply(rig.quaternion);
      rayDirection.set(0,0,-1).applyQuaternion(rayQ).normalize();
      PARAMETERS.brushOrigin.value.copy(rayOrigin);PARAMETERS.brushDirection.value.copy(rayDirection);
      PARAMETERS.brushEnabled.value=!restoring&&!erase;PARAMETERS.eraseEnabled.value=!restoring&&erase;PARAMETERS.undoEnabled.value=restoring;
      try{currentSplatMesh.updateMatrixWorld(true);updateRgba();lastStamp=t;}finally{resetBrush();}
    }
    await buttons();
    status("Ready · "+currentSplatMesh.packedSplats.numSplats.toLocaleString()+" original Gaussian splats");
    renderer.setAnimationLoop((t,frame)=>{
      const dt=prevT?Math.min(.05,(t-prevT)/1000):0;prevT=t;
      try {
        if(renderer.xr.isPresenting)xrInput(t,frame,dt);
        else if(PARAMETERS.controlsEnabled)controls.update(camera);
        renderer.render(scene,camera);
      } catch(e){lastError="Render failed: "+e.message;status(lastError);renderer.setAnimationLoop(null);renderer.xr.getSession()?.end().catch(()=>{});}
    });
  </script>
</body>
</html>
